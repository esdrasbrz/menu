<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Maju &amp; Esdras — Cardápio</title>
    <meta
      name="description"
      content="O cardápio de café e dos drinks da noite na casa de Maju e Esdras."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <!--
      Set the theme before first paint so there is no flash of the wrong one. Each tab has its own
      theme (see the `theme` field on tabs in src/data/menu.ts) — the day tab is the only one at
      '/', everything else is night, which this mirrors without waiting on the JS module to load.
    -->
    <script>
      document.body.dataset.theme = window.location.pathname === '/' ? 'day' : 'night';
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
