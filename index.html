<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Maju &amp; Esdras — Cardápio</title>
    <meta
      name="description"
      content="O cardápio de café e dos drinks da noite na casa de Maju e Esdras."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <body>
    <!-- Set the theme before first paint so there is no flash of the wrong one. -->
    <script>
      var h = new Date().getHours();
      document.body.dataset.theme = h >= 6 && h < 18 ? 'day' : 'night';
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
